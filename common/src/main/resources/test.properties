# URLs and credentials of the test stand
stand.url=http://localhost:8080
api.url=http://localhost:8080
admin.login=admin
admin.password=secret123
invalid.login=wrong-login
invalid.password=wrong-password

# API routes and expected responses
api.login.path=/login
api.goods.add.path=/goods/add
api.goods.item.path=/goods/{id}
api.goods.list.path=/goods/list
api.status.success=200
api.status.validation.error=400
api.status.not.found=404
api.status.redirect=302
api.list.page=0
api.list.size=1000
