# UI paths, selectors and texts
ui.admin.path=/admin
selector.main.title=#main-title
selector.products.list=#products-list
selector.product.cards=.product-card
selector.product.card.by.id=.product-card[data-id='%s']
selector.product.card.by.name=.product-card[data-name='%s']
